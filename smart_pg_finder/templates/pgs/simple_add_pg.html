<!DOCTYPE html>
<html>
<head><title>Test Add PG</title></head>
<body>
<h1>Test Add PG (Minimal)</h1>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <p>Name: <input type="text" name="name" required></p>
    <p>Location: <input type="text" name="location" required></p>
    <p>Price: <input type="number" name="price" step="0.01" required></p>
    <p>Description: <textarea name="description"></textarea></p>
    <p>Phone: <input type="text" name="phone"></p>
    <p><button type="submit">Add PG</button></p>
</form>
{% if messages %}
<ul>
{% for message in messages %}
<li>{{ message }}</li>
{% endfor %}
</ul>
{% endif %}
</body>
</html>
